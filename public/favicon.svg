<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Hexagonal circuit board background -->
  <path d="M16 2 L5.5 6.5 L5.5 25.5 L16 30 L26.5 25.5 L26.5 6.5 Z"
        fill="#0a0f1a" stroke="url(#springGrad)" stroke-width="1.5"/>
  <!-- Inner hexagon -->
  <path d="M16 4.5 L7 8 L7 24 L16 27.5 L25 24 L25 8 Z"
        fill="#0d1117" stroke="url(#springGrad)" stroke-width="0.5" opacity="0.8"/>
  <!-- Circuit lines -->
  <g stroke="url(#springGrad)" stroke-width="0.6" stroke-linecap="round" opacity="0.6">
    <path d="M9 16 L13 16"/>
    <path d="M19 16 L23 16"/>
    <path d="M16 9 L16 13"/>
    <path d="M16 19 L16 23"/>
    <circle cx="9" cy="16" r="1.5" fill="url(#springGrad)"/>
    <circle cx="23" cy="16" r="1.5" fill="url(#springGrad)"/>
    <circle cx="16" cy="9" r="1.5" fill="url(#springGrad)"/>
    <circle cx="16" cy="23" r="1.5" fill="url(#springGrad)"/>
  </g>
  <!-- Spring "S" letter -->
  <text x="16" y="21.5" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="800"
        fill="url(#springGrad)"
        filter="url(#glow)">
    S
  </text>
</svg>