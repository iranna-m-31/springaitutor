<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#0d1117"/>
  <text x="400" y="45" text-anchor="middle" fill="#e6edf3" font-family="system-ui" font-size="20" font-weight="600">Tool Calling Flow</text>
  <rect x="40" y="80" width="140" height="100" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="115" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="12">User</text>
  <text x="110" y="138" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="9">"What time is it?"</text>
  <path d="M185 130 L225 130" stroke="url(#toolGrad)" stroke-width="3" fill="none"/>
  <rect x="230" y="80" width="180" height="120" rx="14" fill="#134e4a" stroke="#10b981" stroke-width="2"/>
  <text x="320" y="115" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="13" font-weight="600">ChatClient</text>
  <text x="320" y="140" text-anchor="middle" fill="#d1fae5" font-family="monospace" font-size="10">Tools Enabled</text>
  <path d="M415 140 L465 140" stroke="url(#toolGrad)" stroke-width="3" fill="none"/>
  <rect x="470" y="80" width="160" height="120" rx="14" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="115" text-anchor="middle" fill="#fcd34d" font-family="system-ui" font-size="13" font-weight="600">ToolCallingAdvisor</text>
  <text x="550" y="138" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="9">Orchestrates loop</text>
  <path d="M635 140 L685 140" stroke="url(#toolGrad)" stroke-width="3" fill="none"/>
