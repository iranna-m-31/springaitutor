  <text x="400" y="245" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="14" font-weight="600">Tool Calling Loop</text>
  <text x="400" y="275" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12">User → LLM → Tool → LLM → User</text>
  <text x="400" y="310" text-anchor="middle" fill="#60a5fa" font-family="system-ui" font-size="12">Example: User → @Tool → DateTimeTools → LLM → Response</text>
