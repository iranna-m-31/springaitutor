  <text x="760" y="138" text-anchor="end" fill="#64748b" font-family="monospace" font-size="9">DateTimeTools</text>
  <path d="M835 140 L835 200 L230 200 L230 170" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
